<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#12041f;color:#fff;font-family:Poppins,system-ui,sans-serif;touch-action:manipulation}
.aurora{position:fixed;inset:-20%;background:
radial-gradient(40% 35% at 20% 25%,#ff2e7e66,transparent 70%),
radial-gradient(35% 40% at 80% 30%,#7b3fe466,transparent 70%),
radial-gradient(45% 40% at 50% 90%,#ff7ab855,transparent 70%);
animation:drift 14s ease-in-out infinite alternate;filter:blur(30px)}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.15) rotate(6deg)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:1}
.scr{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s;overflow-y:auto}
.scr.on{opacity:1;visibility:visible}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(30px,9vw,46px);line-height:1.15;margin:10px 0;font-weight:600;
background:linear-gradient(90deg,#fff,#ffb3d1,#c9a2ff,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.sub{font-weight:300;opacity:.85;margin:0 0 26px;letter-spacing:.5px;min-height:24px}
.hw{position:relative;width:150px;height:140px;display:grid;place-items:center;margin-bottom:8px}
.hw:before,.hw:after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px solid #ff4f8b88;animation:ring 2.4s infinite}
.hw:after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.7);opacity:0}}
.heart{width:110px;animation:beat 1.2s infinite;transition:filter .5s;filter:drop-shadow(0 0 18px #ff2e7e)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.btn{font:500 18px Poppins,sans-serif;color:#fff;border:0;border-radius:999px;padding:15px 34px;cursor:pointer;background:linear-gradient(135deg,#ff2e7e,#ff7ab8);box-shadow:0 8px 28px #ff2e7e66,inset 0 1px 0 #fff6;transition:transform .3s,left .3s,top .3s}
.btn.ghost{background:#ffffff1f;box-shadow:none;border:1px solid #ffffff44;backdrop-filter:blur(8px)}
.row{display:flex;gap:18px;align-items:center;justify-content:center;min-height:100px}
.glass{background:#ffffff14;border:1px solid #ffffff30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:26px 24px;max-width:350px;line-height:1.75;font-size:17px;font-weight:300;box-shadow:0 20px 60px #0006;min-height:100px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:350px;margin:18px 0 4px}
.chips span{background:#ffffff1a;border:1px solid #ffffff2e;border-radius:999px;padding:8px 15px;font-size:14px;animation:pop .6s both}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(14px)}}
.meter{width:230px;height:8px;border-radius:9px;background:#ffffff22;margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2e7e,#ffb3d1);transition:width .5s;box-shadow:0 0 12px #ff2e7e}
.lbl{font-size:12px;opacity:.6;margin-top:6px;letter-spacing:2px}
</style>
</head>
<body>
<div class="aurora"></div>
<canvas id="cv"></canvas>

<section class="scr on" id="s0">
  <div class="hw"><svg class="heart" viewBox="0 0 32 29.6"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ab8"/><stop offset="1" stop-color="#ff1e6e"/></linearGradient></defs><path fill="url(#g)" d="M23.6,0c-3.4,0-6.4,2.1-7.6,5.2C14.8,2.1,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg></div>
  <h1 id="t0"></h1>
  <p class="sub">Sana küçük bir sürprizim var</p>
  <button class="btn" id="start">Başla</button>
</section>

<section class="scr" id="s1">
  <div class="hw"><svg class="heart" id="h1" viewBox="0 0 32 29.6"><path fill="url(#g)" d="M23.6,0c-3.4,0-6.4,2.1-7.6,5.2C14.8,2.1,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg></div>
  <h1 id="q"></h1>
  <p class="sub" id="sub">Dürüst ol</p>
  <div class="row">
    <button class="btn" id="yes">Evet 💖</button>
    <button class="btn ghost" id="no">Hayır</button>
  </div>
  <div class="meter"><i id="bar"></i></div>
  <div class="lbl">KALP ÖLÇER</div>
</section>

<section class="scr" id="s2">
  <h1 id="win"></h1>
  <div class="glass" id="letter"></div>
  <div class="chips" id="chips"></div>
  <button class="btn ghost" id="again" style="margin-top:18px;font-size:14px;padding:10px 22px">Baştan oyna</button>
</section>

<script>
// ---- BURAYI DEĞİŞTİR ----
var CFG={
  isim:"Naz",
  mektup:"Seninle geçen her an çok güzel. Sana gülümsediğin için, benimle olduğun için teşekkür ederim. İyi ki varsın 💖",
  nedenler:["Gülüşün","Kahkahan","Kalbin 💗","Sabrın","Sesin","Bana iyi gelmen"]
};
// --------------------------
var $=function(i){return document.getElementById(i)};
document.title=CFG.isim;
$('t0').textContent=CFG.isim+", sana bir sorum var";
$('q').textContent=CFG.isim+", beni seviyor musun?";
function show(id){document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on')});$(id).classList.add('on')}

// ---- canvas: yıldızlar, kalpler, iz, havai fişek ----
var cv=$('cv'),cx=cv.getContext('2d'),W,H,stars=[],P=[],C=['#ff2e7e','#ff7ab8','#ffd1e3','#c9a2ff','#fff'],E=['💖','💗','💕','💘'];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=[];for(var i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,p:Math.random()*6})}
rs();addEventListener('resize',rs);
function spark(x,y,vx,vy,l,s){P.push({k:0,x:x,y:y,vx:vx,vy:vy,l:l,m:l,s:s||2,c:C[Math.random()*C.length|0],g:.05})}
function heartP(x,y,vx,vy,s,l){P.push({k:1,x:x,y:y,vx:vx,vy:vy,l:l,m:l,s:s,e:E[Math.random()*4|0],g:0})}
function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=1+Math.random()*5;spark(x,y,Math.cos(a)*v,Math.sin(a)*v,60+Math.random()*40,2.5)}for(i=0;i<6;i++)heartP(x,y,(Math.random()-.5)*6,-Math.random()*5-1,18+Math.random()*14,90)}
function trail(e){var t=e.touches?e.touches[0]:e;if(!t)return;for(var i=0;i<2;i++)spark(t.clientX,t.clientY,(Math.random()-.5)*1.5,(Math.random()-.5)*1.5,40,2+Math.random()*2)}
addEventListener('pointermove',trail);addEventListener('touchmove',trail,{passive:true});
addEventListener('pointerdown',function(e){burst(e.clientX,e.clientY,14)});
setInterval(function(){if(P.length<90)heartP(Math.random()*W,H+20,(Math.random()-.5)*.6,-(.6+Math.random()),14+Math.random()*20,400)},500);
var T=0;
(function loop(){
  T+=.03;cx.globalCompositeOperation='source-over';cx.clearRect(0,0,W,H);
  stars.forEach(function(s){cx.globalAlpha=.3+.7*Math.abs(Math.sin(T+s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()});
  P=P.filter(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;
    var a=Math.max(0,p.l/p.m);
    if(p.k){cx.globalAlpha=a*.8;cx.font=p.s+'px serif';cx.fillText(p.e,p.x,p.y)}
    else{cx.globalCompositeOperation='lighter';cx.globalAlpha=a;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;cx.beginPath();cx.arc(p.x,p.y,p.s*a+.5,0,6.28);cx.fill();cx.shadowBlur=0;cx.globalCompositeOperation='source-over'}
    return p.l>0&&p.y>-60;
  });
  requestAnimationFrame(loop);
})();

$('start').onclick=function(){show('s1');burst(W/2,H/2,40)};

// ---- kaçan buton ----
var n=0,no=$('no'),yes=$('yes');
var texts=["Hayır","Emin misin?","Bir daha düşün","Yakala beni","Basamazsın!","Vazgeç","Son şansın"];
var subs=["Dürüst ol","Hmm, yanlış tuşa bastın galiba","Kalbim biraz kırıldı","Bak, Evet büyüyor","Hayır kaçıyor, fark ettin mi?","Neredeyse bitti...","Başka çare kalmadı"];
no.onclick=function(e){
  n++;
  if(navigator.vibrate){try{navigator.vibrate(40)}catch(x){}}
  if(n===1)return;
  var f=Math.max(.1,1-n*.12);
  $('h1').style.filter='saturate('+f+') brightness('+(.6+f*.4)+') drop-shadow(0 0 '+(18*f)+'px #ff2e7e)';
  $('bar').style.width=Math.max(5,100-n*13)+'%';
  $('sub').textContent=subs[Math.min(n-1,subs.length-1)];
  if(n>=8){
    no.style.display='none';
    $('q').textContent=CFG.isim+", başka seçeneğin kalmadı";
    $('sub').textContent="Sadece Evet var 💖";
    $('bar').style.width='100%';
    $('h1').style.filter='drop-shadow(0 0 26px #ff2e7e)';
    yes.style.transform='scale(2.1)';
    return;
  }
  no.textContent=texts[Math.min(n-1,texts.length-1)];
  no.style.position='fixed';
  var w=no.offsetWidth,h=no.offsetHeight;
  no.style.left=Math.random()*(innerWidth-w-20)+10+'px';
  no.style.top=Math.random()*(innerHeight-h-20)+10+'px';
  yes.style.transform='scale('+(1+n*.14)+')';
};

// ---- Evet ----
yes.onclick=function(){
  show('s2');
  $('win').textContent="Biliyordum "+CFG.isim+"! 💖";
  var k=0;
  var fw=setInterval(function(){burst(Math.random()*W,Math.random()*H*.6+40,50);if(++k>14)clearInterval(fw)},450);
  var el=$('letter'),i=0;el.textContent='';
  var t=setInterval(function(){
    el.textContent+=CFG.mektup.charAt(i++);
    if(i>=CFG.mektup.length){clearInterval(t);chips()}
  },45);
};
function chips(){
  var c=$('chips');c.innerHTML='';
  CFG.nedenler.forEach(function(r,k){
    setTimeout(function(){var s=document.createElement('span');s.textContent=r;c.appendChild(s)},k*450);
  });
}
$('again').onclick=function(){location.reload()};
</script>
</body>
</html>
